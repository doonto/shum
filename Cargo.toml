[package]
name = "shum"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
fs2 = "0.4.3"
hex = "0.4.3"
libc = "0.2.190"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"
unicode-width = "0.2.2"
wait-timeout = "0.2.1"

[dev-dependencies]
tempfile = "3.27.0"
