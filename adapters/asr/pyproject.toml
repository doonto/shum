[project]
name = "shum-asr-adapters"
version = "0.1.0"
description = "Isolated Python ASR engine adapters (NeMo, Whisper/Transformers, Qwen3-ASR) for the shum CLI contract."
readme = "README.md"
requires-python = ">=3.10"
# main.py only needs the standard library; heavy per-engine dependencies are
# declared as optional-dependency groups below and installed into their own
# isolated environments (see README.md).
dependencies = []

[project.optional-dependencies]
nemo = [
    "torch>=2.14.1",
    "nemo_toolkit[asr]>=3.0.0",
]
whisper = [
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "accelerate>=1.15.0",
]
qwen = [
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "accelerate>=1.15.0",
    "librosa>=0.11.0",
]
dev = [
    "pytest>=9.1.1",
    "numpy",
    "onnx",
]

# This is a flat, unpackaged project: `main.py` is run directly with
# `python main.py ...` and is never imported as an installed library, so
# there is no [build-system] and uv must not try to build/install it.
[tool.uv]
package = false

# Route the native PyTorch audio stack to CPU-only wheels as well, if an
# engine later brings in TorchAudio or TorchCodec transitively.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
torchcodec = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
